---

- name: Setup kubernetes cluster
  hosts: control_nodes
  become: yes
  tasks:
    - name: Ensure cni directory exists
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: directory
 
    - name: Initialize kubeadm
      ansible.builtin.command: kubeadm init
      register: kubeadm_output
      tags:
      - always

    - name: check successful kubeadm initialization
      ansible.builtin.debug:
        msg: "kubeadm successfully initialized"
      when: "'Your Kubernetes control-plane has initialized successfully' in kubeadm_output.stdout"
