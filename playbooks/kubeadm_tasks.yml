---

- name: Perform kubernetes cluster kubeadm tasks on control node
  hosts: control_nodes
  become: true
  become_user: root
  vars:
    join_error_message: "error: failed to load admin kubeconfig: open /root/.kube/config: no such file or directory"
  tasks:
    # check if kubeadm is initialized / using print token statement
    - name: check if kubeadm is initialized
      ansible.builtin.command: kubeadm token create --print-join-command
      ignore_errors: true
      register: kubeadm_status

    - block:
      # check cni directory used for cni service (weave, calico...etc)
      - name: Ensure cni directory exists
        ansible.builtin.file:
          path: /etc/cni/net.d
          state: directory

      - name: Initialize kubeadm
        ansible.builtin.command: kubeadm init
        register: kubeadm_output
        tags:
        - always

      - name: check successful kubeadm initialization
        ansible.builtin.debug:
          msg: "kubeadm successfully initialized"
        when: "'Your Kubernetes control-plane has initialized successfully' in kubeadm_output.stdout"

      - name: output join instructions
        ansible.builtin.debug:
          msg: "{{ kubeadm_output.stdout }}"
      when: join_error_message in kubeadm_status.stderr

    - name: get worker node join token
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command

    - name: Setting host facts using complex arguments
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_command.stdout }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['worker_nodes'] }}"

- name: Add worker nodes to cluster with kubeadm
  hosts: worker_nodes
  become: true
  become_user: root
  tasks:
    - name: add worker node with join command 
      ansible.builtin.command: "{{ join_command }}"
