---
# tasks file for system_setup

# open vswitch is needed for networking purposes on the ubuntu 22.04 lts system
- include_tasks: openvswitch.yml
  when: ansible_distribution == "Ubuntu" and ansible_distribution_version == "22.04" 

# disable dhcp
- name: Create static network interface
  ansible.builtin.template:
    src: netconf.j2
    dest: /etc/netplan/01-netcfg.yaml
    owner: root
    group: root
    mode: '0600'

# errors here can be ignored. if the file is not there then it's already renamed
- name: Rename the current network interface file
  ansible.builtin.shell:
    cmd: mv 50-cloud-init.yaml 50-cloud-init.yaml.bk
    chdir: /etc/netplan
  ignore_errors: true

# disable cloud-init's network configuration
- name: disable cloud-init
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}"

# activate new interface file that sets a static IP address
- name: apply new netplan
  ansible.builtin.shell:
    cmd: netplan apply

# test that you can still ping the external IP for the machine
- name: test ping
  ansible.builtin.shell:
    cmd: ping -q -c5 {{ ansible_default_ipv4.address }}
  register: ping_test
  failed_when: '"5 packets transmitted, 5 received" not in ping_test.stdout'

- include_tasks: os_config_tasks.yml
